apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-service
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-service
  template:
    metadata:
      labels:
        app: main-service
    spec:
      containers:
        - name: main-service
          # Image will be updated by workflow with DOCKER_USERNAME
          # Format: DOCKER_USERNAME/node-kube-main-service:latest
          image: gaurav01245/node-kube-main-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: main-service-config
                
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10