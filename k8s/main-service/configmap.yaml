apiVersion: v1
kind: ConfigMap
metadata:
  name: main-service-config
  namespace: microservices
data:
  PORT: "3000"
  NODE_ENV: "production"
  SERVICE_NAME: "main-service"
  LOG_LEVEL: "info"
  API_PREFIX: "/api"
  CORS_ORIGIN: "http://localhost:3000,http://localhost:8080"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  REQUEST_TIMEOUT: "30000"