# Alternative ingress configuration for GKE using Google Cloud Load Balancer
# Use this if you prefer GKE's built-in ingress instead of ingress-nginx
# To use: kubectl apply -f k8s/ingress/api-gateway-gke.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: microservices
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "api-gateway-ip"  # Optional: reserve a static IP
    networking.gke.io/managed-certificates: "api-gateway-cert"     # Optional: for HTTPS
spec:
  rules:
    - host: your-domain.com  # Replace with your domain
      http:
        paths:
          # User Service Routes
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          # Product Service Routes
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/messages
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/comments
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          # Main Service Routes
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 80
          # Health Checks
          - path: /health
            pathType: Exact
            backend:
              service:
                name: main-service
                port:
                  number: 80
          - path: /api/user-service/health
            pathType: Exact
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /api/product-service/health
            pathType: Exact
            backend:
              service:
                name: product-service
                port:
                  number: 80

