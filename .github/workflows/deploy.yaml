name: Build & Deploy Microservices

on:
  push:
    branches:
      - main


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push main service
        uses: docker/build-push-action@v5
        with:
          context: ./services/main-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/node-kube-main-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/node-kube-main-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/node-kube-main-service:buildcache,mode=max

      - name: Build and push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/user-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/node-kube-user-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/node-kube-user-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/node-kube-user-service:buildcache,mode=max

      - name: Build and push product-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/product-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/node-kube-product-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/node-kube-product-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/node-kube-product-service:buildcache,mode=max

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespaces/
          kubectl apply -f k8s/config/
          kubectl apply -f k8s/main-service/
          kubectl apply -f k8s/user-service/
          kubectl apply -f k8s/product-service/
          kubectl apply -f k8s/ingress/