name: CI/CD Microservices Helm

# Trigger workflow **only on tags**: dev*, staging*, prod*
on:
  push:
    tags:
      - 'dev*'
      - 'staging*'
      - 'prod*'

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_USERNAME }}
  GKE_PROJECT: ${{ secrets.GKE_PROJECT }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # 1. Checkout the repo
      # -------------------------------
      - uses: actions/checkout@v4

      # -------------------------------
      # 2. Determine environment from Git tag
      # -------------------------------
      - name: Set deployment environment
        id: set-env
        run: |
          TAG_NAME=${GITHUB_REF##*/}   # Extract tag without refs/tags/
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          if [[ "$TAG_NAME" == dev* ]]; then
            echo "env=dev" >> $GITHUB_ENV
            echo "values_file=values-dev.yaml" >> $GITHUB_ENV
            echo "cluster=dev-cluster" >> $GITHUB_ENV
          elif [[ "$TAG_NAME" == staging* ]]; then
            echo "env=staging" >> $GITHUB_ENV
            echo "values_file=values-staging.yaml" >> $GITHUB_ENV
            echo "cluster=staging-cluster" >> $GITHUB_ENV
          elif [[ "$TAG_NAME" == prod* ]]; then
            echo "env=prod" >> $GITHUB_ENV
            echo "values_file=values-prod.yaml" >> $GITHUB_ENV
            echo "cluster=prod-cluster" >> $GITHUB_ENV
          else
            echo "Error: Invalid tag format" 
            exit 1
          fi

      # -------------------------------
      # 3. Setup Docker Buildx
      # -------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------
      # 4. Docker login
      # -------------------------------
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------------
      # 5. Build and push Docker images
      # -------------------------------
      - name: Build & push Docker images
        run: |
          for service in main user product; do
            IMAGE_TAG=${DOCKER_REGISTRY}/node-kube-$service:${TAG_NAME}
            echo "Building $service -> $IMAGE_TAG"
            docker build -t $IMAGE_TAG ./services/$service-service
            docker push $IMAGE_TAG
            # Store image tag in env var for later use
            echo "${service}_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV
          done

      # -------------------------------
      # 6. Authenticate to Google Cloud (Dev)
      # -------------------------------
      - name: Authenticate to Google Cloud (Dev)
        if: env.env == 'dev'
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY_DEV }}

      # -------------------------------
      # 6. Authenticate to Google Cloud (Staging)
      # -------------------------------
      - name: Authenticate to Google Cloud (Staging)
        if: env.env == 'staging'
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY_STAGING }}

      # -------------------------------
      # 6. Authenticate to Google Cloud (Prod)
      # -------------------------------
      - name: Authenticate to Google Cloud (Prod)
        if: env.env == 'prod'
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY_PROD }}

      # -------------------------------
      # 7. Setup GKE credentials
      # -------------------------------
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.cluster }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ secrets.GKE_PROJECT }}

      # -------------------------------
      # 8. Setup Helm
      # -------------------------------
      - name: Setup Helm
        uses: azure/setup-helm@v3

      # -------------------------------
      # 9. Cleanup old Helm releases and conflicting resources
      # -------------------------------
      - name: Cleanup old Helm releases
        run: |
          echo "Checking for Helm releases..."
          # List all releases in the namespace
          helm list -n ${{ env.env }} || echo "No existing releases found"
          
          # Check if the new unified release already exists
          if helm list -n ${{ env.env }} | grep -q "node-kube-microservices"; then
            echo "Unified release 'node-kube-microservices' exists - safe to clean up old releases"
            # Uninstall old individual service releases if they exist
            for old_release in node-kube-main node-kube-user node-kube-product; do
              if helm list -n ${{ env.env }} | grep -q "$old_release"; then
                echo "Uninstalling old release: $old_release"
                helm uninstall $old_release -n ${{ env.env }} || echo "Failed to uninstall $old_release"
              fi
            done
            # Wait for cleanup
            sleep 5
          else
            echo "First deployment detected - cleaning up conflicting resources"
            echo "Removing resources that will be recreated by the new unified release..."
            
            # Delete shared resources that will be recreated (these are safe to delete)
            kubectl delete configmap microservices-config -n ${{ env.env }} --ignore-not-found=true || true
            kubectl delete ingress api-gateway -n ${{ env.env }} --ignore-not-found=true || true
            
            echo "Conflicting resources removed. Old releases kept for rollback if needed."
            sleep 3
          fi
          echo "Cleanup check complete"

      # -------------------------------
      # 10. Helm upgrade/install
      # -------------------------------
      - name: Helm Upgrade/Install
        run: |
          # Verify chart directory and Chart.yaml exist
          echo "Current directory: $(pwd)"
          echo "Checking helm chart directory..."
          ls -la ./helm/microservices/ || echo "Directory not found"
          ls -la ./helm/microservices/Chart.yaml || echo "Chart.yaml not found"
          echo "---"
          
          # Build helm set arguments for all services
          SET_ARGS=""
          for service in main user product; do
            # Get the image tag from environment variable
            IMAGE_VAR="${service}_IMAGE"
            IMAGE_TAG="${!IMAGE_VAR}"
            echo "Preparing $service with image: $IMAGE_TAG"
            # Extract repository and tag from IMAGE_TAG (format: registry/image:tag)
            IMAGE_REPO=$(echo "$IMAGE_TAG" | cut -d: -f1)
            IMAGE_TAG_ONLY=$(echo "$IMAGE_TAG" | cut -d: -f2)
            SET_ARGS="$SET_ARGS --set image.$service.repository=$IMAGE_REPO --set image.$service.tag=$IMAGE_TAG_ONLY"
          done
          
          # Deploy all services as a single Helm release
          echo "Deploying all microservices as a single release..."
          helm upgrade --install node-kube-microservices ./helm/microservices \
            --namespace ${{ env.env }} \
            --create-namespace \
            --values ./helm/microservices/${{ env.values_file }} \
            $SET_ARGS

      # -------------------------------
      # 11. Verify rollout
      # -------------------------------
      - name: Verify rollout
        run: |
          echo "Checking pods in namespace ${{ env.env }}..."
          kubectl get pods -n ${{ env.env }}
          echo "---"
          for service in main user product; do
            echo "Waiting for $service deployment to be ready..."
            kubectl rollout status deployment/$service -n ${{ env.env }} --timeout=5m
          done
          echo "All deployments are ready!"
