name: Build & Deploy to GKE

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT }}

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
        location: ${{ secrets.GKE_ZONE }}

    - name: Install ingress-nginx (if not exists)
      run: |
        # Check if ingress-nginx namespace exists
        if ! kubectl get namespace ingress-nginx &> /dev/null; then
          echo "Installing ingress-nginx controller..."
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml
          echo "Waiting for ingress-nginx controller to be ready..."
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s || true
        else
          echo "ingress-nginx namespace already exists, checking controller status..."
          kubectl get pods -n ingress-nginx || echo "Controller pods not found"
        fi
        
        # Verify ingress class exists
        if ! kubectl get ingressclass nginx &> /dev/null; then
          echo "Creating ingress class 'nginx'..."
          kubectl create ingressclass nginx \
            --controller=k8s.io/ingress-nginx \
            --dry-run=client -o yaml | kubectl apply -f -
        else
          echo "Ingress class 'nginx' already exists"
        fi

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push main-service
      uses: docker/build-push-action@v5
      with:
        context: ./services/main-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/node-kube-main-service:latest

    - name: Build & Push user-service
      uses: docker/build-push-action@v5
      with:
        context: ./services/user-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/node-kube-user-service:latest

    - name: Build & Push product-service
      uses: docker/build-push-action@v5
      with:
        context: ./services/product-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/node-kube-product-service:latest

    - name: Deploy to GKE
      run: |
        # Apply namespace
        kubectl apply -f k8s/namespaces/microservices.yaml
        
        # Apply config files only if they exist and are not empty
        if [ -s k8s/config/common-config.yaml ]; then
          kubectl apply -f k8s/config/common-config.yaml
        fi
        
        if [ -s k8s/config/secrets.yaml ]; then
          kubectl apply -f k8s/config/secrets.yaml
        fi

        # Apply service deployments
        kubectl apply -f k8s/main-service/
        kubectl apply -f k8s/user-service/
        kubectl apply -f k8s/product-service/
        kubectl apply -f k8s/ingress/
