# Prettier configuration
# Note: Prettier doesn't fully support Helm templates
# Use helm lint for Helm-specific validation

printWidth: 100
tabWidth: 2
useTabs: false
semi: false
singleQuote: true
trailingComma: 'es5'
bracketSpacing: true
arrowParens: 'avoid'

# Ignore Helm templates
ignorePath: .prettierignore

